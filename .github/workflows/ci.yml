name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  render:
    name: Render a clip and check Node against Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the libraries Chrome Headless Shell needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
      - run: npm ci
      - name: Render one second of scenes/readme-demo.json at a quarter of its size
        run: |
          npm run make -- scenes/readme-demo.json --scale=0.25 --frames=0-59 --out=out/ci-preview.mp4
          test "$(wc -c < out/ci-preview.mp4)" -gt 10000
          md5sum out/ci-preview.mp4
      - name: Same simulation in Node and in the Chromium that renders the frames
        run: npm run parity
